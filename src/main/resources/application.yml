spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  flyway:
    enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Session verification must fail before the native client's request deadline.
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /ELPSY
auth:
  jwt-secret: ${JWT_SECRET}
  cookie-secure: ${AUTH_COOKIE_SECURE:true}
shop:
  notifications:
    mock-enabled: ${MOCK_NOTIFICATIONS_ENABLED:false}
    worker-enabled: ${NOTIFICATIONS_WORKER_ENABLED:false}
    fixed-delay-ms: ${NOTIFICATIONS_DELAY_MS:30000}
  images:
    enabled: ${SHOP_IMAGES_ENABLED:false}
    endpoint: ${SHOP_IMAGES_ENDPOINT:}
    access-key: ${SHOP_IMAGES_ACCESS_KEY:}
    secret-key: ${SHOP_IMAGES_SECRET_KEY:}
    bucket: ${SHOP_IMAGES_BUCKET:elpsy-shop-images-demo}
    init-bucket: ${SHOP_IMAGES_INIT_BUCKET:false}
