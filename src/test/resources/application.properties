# 只在測試 classpath：員工 MFA 測試用加密金鑰（非正式值）。放在共用設定，避免為單一測試多開 Spring context（CI MySQL 連線數有限）。
MFA_ENCRYPTION_KEY=test-only-mfa-encryption-key-0123456789
# 測試會快取多個 Spring context，每個 context 各有連線池；縮小池子避免 CI MySQL Too many connections（本機以 4／0 跑全套通過）
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
